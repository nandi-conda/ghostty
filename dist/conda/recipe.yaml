context:
  name: ghostty
  version: "1.4.1"

package:
  name: ${{ name }}
  version: ${{ version }}

# This recipe does not build Ghostty. It wraps the AppImage that
# .github/workflows/appimage.yml builds: the release workflow downloads the
# `appimage` artifact into dist/conda/appimage/ and then runs this recipe.
# To build locally, put Ghostty-*-x86_64.AppImage in dist/conda/appimage/.
source:
  - path: appimage
  # Keep the license text next to the recipe's source so rattler-build can
  # copy it into the package.
  - path: ../../LICENSE

build:
  number: 0
  script:
    file: build.sh

tests:
  - package_contents:
      bin:
        - ghostty.AppImage
      files:
        - Menu/ghostty.json
        - Menu/ghostty.png
  - script:
      - test -x "$PREFIX/bin/ghostty.AppImage"

about:
  homepage: https://ghostty.org
  summary: A fast, native, feature-rich terminal emulator
  description: |
    Ghostty is a terminal emulator that differentiates itself by being fast,
    feature-rich, and native. This package installs the self-contained
    AppImage and a menuinst shortcut that launches it.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/ghostty-org/ghostty
