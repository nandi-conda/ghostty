context:
  name: ghostty
  version: "1.4.1"

package:
  name: ${{ name }}
  version: ${{ version }}

# Builds the GTK app from this checkout. The AppImage is only for GitHub
# releases and is not involved here.
source:
  - path: ../..
    use_gitignore: true
  # blueprint-compiler is not on conda-forge; build.sh installs this wheel.
  - url: https://files.pythonhosted.org/packages/14/5c/9f61bc2e82d7970dca4c38b727c4541449bd276660953298795fe0eb84a7/blueprint_compiler-0.22.2-py3-none-any.whl
    sha256: f6107b34ca21daa209e8e26ce518269e2e332e674da6450ba882ca72d33d2f32
    file_name: blueprint_compiler-0.22.2-py3-none-any.whl
    target_directory: .wheels

build:
  # CI sets the build number to the commit count so every publish is a new
  # file on the channel.
  number: ${{ env.get("GHOSTTY_CONDA_BUILD_NUMBER", default="0") }}
  skip: not linux
  script:
    file: build.sh
    env:
      GHOSTTY_ZIG_CACHE: ${{ env.get("GHOSTTY_ZIG_CACHE", default="") }}
  # Zig fetches the dependencies pinned in build.zig.zon at build time.
  # Their hashes are pinned there, so the result is still reproducible.

requirements:
  build:
    - zig ==0.17.0
    - pkg-config
    - gettext
    - glib-tools
    - libxml2
    - ncurses
    - pandoc
    # blueprint-compiler (installed by build.sh) loads the GTK and
    # libadwaita typelibs through PyGObject.
    - python 3.12.*
    - pip
    - pygobject
    - gtk4
    - libadwaita
  host:
    - gtk4
    - libadwaita
    - gtk4-layer-shell
    - glib
    - wayland
    - libegl-devel
    - libgl-devel
    - fontconfig
    - xorg-libx11
  run:
    - gtk4
    - libadwaita
    - gtk4-layer-shell
    - adwaita-icon-theme
    - gsettings-desktop-schemas

tests:
  - package_contents:
      bin:
        - ghostty
      files:
        - share/applications/com.mitchellh.ghostty.desktop
        - Menu/ghostty.json
  - script:
      - ghostty +version

about:
  homepage: https://ghostty.org
  summary: A fast, native, feature-rich terminal emulator
  description: |
    Ghostty is a terminal emulator that differentiates itself by being fast,
    feature-rich, and native. This package builds the GTK app from source
    and adds a menuinst shortcut for it.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/ghostty-org/ghostty
