# Build the GTK app from source as a conda package and publish it to
# prefix.dev/nandi-testing. The AppImage stays a GitHub release artifact only.
name: Conda

on:
  push:
    branches: [main]
    paths:
      - "dist/conda/**"
      - ".github/workflows/conda.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'nandi-conda/ghostty'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            os: ubuntu-24.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count.
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@fef5c9568ca6c4ff7707bf840ab0692ba3f08293 # v0.9.0
        with:
          pixi-version: v0.83.0
          run-install: false

      # deps.files.ghostty.org sometimes stalls or drops a download midway.
      # Fetch every Zig dependency up front, bounded and retried, into a
      # cached directory that build.sh then uses, so the rattler-build step
      # does not touch that host.
      - name: Restore Zig dependencies
        id: zig-deps
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/zig-global-cache/p
          key: conda-zig-deps-${{ matrix.platform }}-0.17.0-${{ hashFiles('build.zig.zon', '**/build.zig.zon') }}
          restore-keys: |
            conda-zig-deps-${{ matrix.platform }}-0.17.0-

      - name: Fetch Zig dependencies
        shell: bash
        timeout-minutes: 20
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
        run: |
          for attempt in 1 2 3 4; do
            if timeout 300 pixi exec --spec zig==0.17.0 -- zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::zig build --fetch=all attempt $attempt failed"
            sleep $((attempt * 10))
          done
          echo "::error::Fetching Zig dependencies failed after 4 attempts"
          exit 1

      - name: Save Zig dependencies
        if: steps.zig-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/zig-global-cache/p
          key: conda-zig-deps-${{ matrix.platform }}-0.17.0-${{ hashFiles('build.zig.zon', '**/build.zig.zon') }}

      - name: Build
        shell: bash
        timeout-minutes: 60
        env:
          GHOSTTY_ZIG_CACHE: ${{ runner.temp }}/zig-global-cache
        run: |
          set +e
          GHOSTTY_CONDA_BUILD_NUMBER=$(git rev-list --count HEAD) \
            pixi exec rattler-build build --recipe dist/conda/recipe.yaml \
            -c conda-forge --output-dir dist-out/conda 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo '### Conda build failed'
              echo '```'
              tail -n 200 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Job logs and step summaries need authentication to read, while
            # annotations do not. GitHub keeps ten per step, so send the
            # script output just before rattler-build's own failure banner,
            # 25 lines per annotation.
            sed 's/\x1b\[[0-9;]*m//g' /tmp/build.log \
              | awk '/× error Script failed/ {exit} {print}' \
              | grep -v '^ *$' | tail -n 200 | cut -c1-220 \
              | split -l 25 - /tmp/annot.
            for f in /tmp/annot.*; do
              printf '::error title=conda build::%s\n' \
                "$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')"
            done
          fi
          exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-${{ matrix.platform }}
          path: dist-out/conda/**/ghostty-*.conda

      - name: Publish to prefix.dev
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY || secrets.PREFIX_DEV_TOKEN }}
        run: |
          shopt -s globstar
          if [ -z "$PREFIX_API_KEY" ]; then
            echo "::error::Neither PREFIX_API_KEY nor PREFIX_DEV_TOKEN is available to this job"
            exit 1
          fi
          set +e
          pixi exec rattler-build upload prefix -c nandi-testing --skip-existing \
            dist-out/conda/**/ghostty-*.conda 2>&1 | tee /tmp/upload.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            printf '::error title=prefix.dev upload::%s\n' \
              "$(sed 's/\x1b\[[0-9;]*m//g' /tmp/upload.log | tail -n 25 | cut -c1-220 \
                | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit "$rc"
          fi
          set -e
          echo "Published $(cd dist-out/conda && ls **/ghostty-*.conda)" >> "$GITHUB_STEP_SUMMARY"
