# Build the GTK app from source as a conda package and publish it to
# prefix.dev/nandi-testing. The AppImage stays a GitHub release artifact only.
name: Conda

on:
  push:
    branches: [main]
    paths:
      - "dist/conda/**"
      - ".github/workflows/conda.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'nandi-conda/ghostty'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            os: ubuntu-24.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count.
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@fef5c9568ca6c4ff7707bf840ab0692ba3f08293 # v0.9.0
        with:
          pixi-version: v0.83.0
          run-install: false

      - name: Build
        shell: bash
        run: |
          set +e
          GHOSTTY_CONDA_BUILD_NUMBER=$(git rev-list --count HEAD) \
            pixi exec rattler-build build --recipe dist/conda/recipe.yaml \
            -c conda-forge --output-dir dist-out/conda 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo '### Conda build failed'
              echo '```'
              tail -n 200 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Job logs and step summaries need authentication to read. The
            # annotations below are visible without a token, and GitHub keeps
            # only ten per step, so pick the error lines first.
            {
              grep -iE 'error|failed|fatal|not found|undefined|traceback' /tmp/build.log | tail -n 6
              echo '...'
              tail -n 3 /tmp/build.log
            } | while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
          fi
          exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda-${{ matrix.platform }}
          path: dist-out/conda/**/ghostty-*.conda

      - name: Publish to prefix.dev
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY || secrets.PREFIX_DEV_TOKEN }}
        run: |
          shopt -s globstar
          pixi exec rattler-build upload prefix -c nandi-testing --skip-existing \
            dist-out/conda/**/ghostty-*.conda
          echo "Published $(cd dist-out/conda && ls **/ghostty-*.conda)" >> "$GITHUB_STEP_SUMMARY"
