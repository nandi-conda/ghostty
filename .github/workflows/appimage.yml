# Build a Ghostty AppImage with zsync update metadata.
#
# The AppImage is part of the rolling ("tip") GitHub release. Every run
# produces a versioned pair for direct downloads and a version-independent
# pair that is published as the update channel, so installed AppImages can
# update themselves without knowing about a specific commit.
#
# The build runs inside Debian 13 on purpose. Ghostty needs libadwaita 1.7 or
# newer, and the oldest distribution with that version sets the glibc baseline
# of the AppImage. Building in a newer distribution would raise that baseline
# for no reason.
#
# This workflow only builds and uploads a workflow artifact. release-tip.yml
# publishes the files to the GitHub release and to tip.files.ghostty.org.
on:
  workflow_call:
    inputs:
      version:
        description: "Version used in the AppImage file name"
        type: string
        required: true
      version-string:
        description: "Semantic version for -Dversion-string; empty uses build.zig.zon"
        type: string
        required: false
        default: ""
      channel-base:
        description: "Base URL of the AppImage update channel"
        type: string
        required: false
        default: "https://tip.files.ghostty.org/appimage"
      runner:
        description: "Runner label; must be able to run container jobs"
        type: string
        required: false
        default: "depot-ubuntu-24.04-8"

  workflow_dispatch:
    inputs:
      version:
        description: "Version used in the AppImage file name"
        type: string
        required: true
      version-string:
        description: "Semantic version for -Dversion-string; empty uses build.zig.zon"
        type: string
        required: false
        default: ""
      channel-base:
        description: "Base URL of the AppImage update channel"
        type: string
        required: false
        default: "https://tip.files.ghostty.org/appimage"

name: AppImage

permissions:
  contents: read

env:
  # Keep these in sync with build.zig.zon (Zig) and test the AppImage build
  # when upgrading. The SHA-256 values pin the artifacts that are downloaded.
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
  LINUXDEPLOY_VERSION: "1-alpha-20251107-1"
  LINUXDEPLOY_SHA256: "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
  LINUXDEPLOY_GTK_COMMIT: "7a3fbc31a9e5075073ff8790f26effbac5f84453"
  LINUXDEPLOY_GTK_SHA256: "b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171"
  GHOSTTY_VERSION: ${{ inputs.version || github.sha }}
  GHOSTTY_VERSION_STRING: ${{ inputs.version-string }}
  CHANNEL_BASE: ${{ inputs.channel-base }}

jobs:
  build:
    runs-on: ${{ inputs.runner || 'depot-ubuntu-24.04-8' }}
    container:
      image: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    timeout-minutes: 90
    env:
      APPDIR: ${{ github.workspace }}/AppDir
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # The Debian image has no git, and checkout runs inside the container.
      - name: Install git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            appstream \
            blueprint-compiler \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            gettext \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            gsettings-desktop-schemas \
            libadwaita-1-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libgdk-pixbuf-2.0-dev \
            libgirepository1.0-dev \
            libgl1-mesa-dev \
            libglib2.0-bin \
            libglib2.0-dev \
            libglib2.0-dev-bin \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            libpng-dev \
            librsvg2-dev \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxml2-utils \
            libxrandr-dev \
            libxcursor-dev \
            ncurses-bin \
            pandoc \
            pkg-config \
            wayland-protocols \
            xz-utils \
            zsync

      - name: Install Zig
        run: |
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /opt
          ln -s "/opt/zig-x86_64-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Install AppImage tools
        run: |
          mkdir -p /opt/appimage

          curl -fsSL -o /opt/appimage/linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  /opt/appimage/linuxdeploy" | sha256sum -c -

          curl -fsSL -o /opt/appimage/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  /opt/appimage/appimagetool" | sha256sum -c -

          # The GTK plugin is a shell script; pin the commit and its contents.
          curl -fsSL -o /opt/appimage/linuxdeploy-plugin-gtk.sh \
            "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${LINUXDEPLOY_GTK_COMMIT}/linuxdeploy-plugin-gtk.sh"
          echo "${LINUXDEPLOY_GTK_SHA256}  /opt/appimage/linuxdeploy-plugin-gtk.sh" | sha256sum -c -

          chmod +x /opt/appimage/linuxdeploy /opt/appimage/appimagetool \
            /opt/appimage/linuxdeploy-plugin-gtk.sh
          echo "/opt/appimage" >> "$GITHUB_PATH"

      - name: Build Ghostty
        shell: bash
        run: |
          set +e
          args=(-Doptimize=ReleaseFast -Dcpu=baseline)
          # -Dversion-string must be a semantic version, so tip builds leave it
          # unset and keep the version from build.zig.zon. A hash would make
          # configuration fail.
          if [ -n "$GHOSTTY_VERSION_STRING" ]; then
            args+=("-Dversion-string=$GHOSTTY_VERSION_STRING")
          fi
          zig build --prefix "$APPDIR/usr" "${args[@]}" 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo '### Build Ghostty failed'
              echo '```'
              tail -n 200 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Job logs and step summaries need authentication to read. The
            # annotation below is visible without a token, so a failing fork
            # build reports its error there too.
            tail -n 15 /tmp/build.log | while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
          fi
          exit "$rc"

      - name: Build AppImage
        run: |
          dist/linux/appimage/build-appimage.sh \
            --appdir "$APPDIR" \
            --version "$GHOSTTY_VERSION" \
            --channel-base "$CHANNEL_BASE" \
            --output "$PWD/dist-out"
          sha256sum dist-out/*

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: |
            dist-out/Ghostty-${{ inputs.version || github.sha }}-x86_64.AppImage
            dist-out/Ghostty-${{ inputs.version || github.sha }}-x86_64.AppImage.zsync
            dist-out/Ghostty-x86_64.AppImage
            dist-out/Ghostty-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 2
