# Bootstrap for the first conda publish on this fork. Remove once
# nandi-testing carries a ghostty package.
#
# The fork has no Namespace runners, so a Release Tip dispatch has to name a
# Depot runner. This workflow dispatches it from a push, because the sandbox
# that prepares the fork has no GitHub credentials of its own.
#
# It is inert in every other case: it does nothing once the channel carries
# ghostty, and it logs and stops while no prefix.dev token secret
# (PREFIX_API_KEY or PREFIX_DEV_TOKEN) is granted to this repository, so it
# never dispatches a build that cannot publish.
name: Bootstrap Conda Publish

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.repository == 'nandi-conda/ghostty'
    runs-on: ubuntu-latest
    steps:
      - name: Check the channel
        id: channel
        run: |
          if curl -fsSL https://prefix.dev/channels/nandi-testing | grep -qi ghostty; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the prefix.dev token
        id: secret
        env:
          TOKEN: ${{ secrets.PREFIX_API_KEY || secrets.PREFIX_DEV_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Neither PREFIX_DEV_TOKEN nor PREFIX_API_KEY is granted to this repository" >&2
            echo "granted=false" >> "$GITHUB_OUTPUT"
          else
            echo "granted=true" >> "$GITHUB_OUTPUT"
          fi
      # A fork run never completes: its macOS and Namespace jobs queue forever
      # and hold the Release Tip concurrency group. Cancel queued runs that have
      # been waiting for a while so one can actually start.
      - name: Make room for a new run
        id: room
        if: steps.channel.outputs.present == 'false' && steps.secret.outputs.granted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          gh run list --workflow release-tip.yml --limit 30 \
            --json databaseId,status,createdAt \
            --jq '.[] | select(.status == "queued") | "\(.databaseId) \(.createdAt)"' |
          while read -r id created; do
            age=$(( now - $(date -d "$created" +%s) ))
            if [ "$age" -gt 600 ]; then
              echo "cancelling queued run $id (queued for ${age}s)"
              gh run cancel "$id" || true
            fi
          done
          live=1
          for _ in 1 2 3 4 5 6; do
            live=$(gh run list --workflow release-tip.yml --limit 30 \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            [ "$live" = "0" ] && break
            sleep 10
          done
          echo "live=${live}" >> "$GITHUB_OUTPUT"

      - name: Dispatch Release Tip
        id: dispatch
        if: |
          steps.channel.outputs.present == 'false' &&
          steps.secret.outputs.granted == 'true' &&
          steps.room.outputs.live == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-tip.yml \
            --repo nandi-conda/ghostty \
            -f runner=depot-ubuntu-24.04-8

      # Job logs need authentication, so report the decision in the step
      # summary, which is readable without a token. Only booleans are shown.
      - name: Report decision
        if: always()
        run: |
          {
            echo "### Bootstrap Conda Publish"
            echo "- channel already has ghostty: ${{ steps.channel.outputs.present }}"
            echo "- prefix.dev token (PREFIX_DEV_TOKEN or PREFIX_API_KEY) visible: ${{ steps.secret.outputs.granted }}"
            echo "- Release Tip dispatch outcome: ${{ steps.dispatch.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
