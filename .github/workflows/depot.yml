# Build and test Ghostty on Depot-hosted GitHub Actions runners.
#
# This workflow mirrors the core Linux checks from test.yml (the "test"
# and "build-linux" jobs) but runs them on Depot runners. Like the rest
# of the repository's CI, the build environment comes from `nix develop`
# so it matches the pinned toolchain exactly.
#
# This is an additional CI path: the existing test.yml workflow and its
# Namespace runners are left untouched.
#
# Repository settings required for the Depot runners:
#   - Install the Depot GitHub App for the repository owner
#     (depot.dev -> GitHub Actions -> Connect to GitHub).
#   - If the repository is public, allow public repositories on the
#     Depot Actions runner group (Organization settings -> Actions ->
#     Runner groups -> Allow public repositories).
# No Depot project token is needed when using Depot runner labels.
# The Cachix cache is read-only here, so no Cachix token is needed either.
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

name: Depot

# Only the latest commit matters for any non-main ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep Zig's caches inside the workspace so actions/cache can persist
  # them across runs (Depot runners supply a fast cache backend).
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

jobs:
  # Cheap check that the whole tree is formatted, so a formatting failure
  # is reported without spending build time.
  zig-fmt:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          skipPush: true

      - name: zig fmt
        run: nix develop -c zig fmt --check .

  # Unit tests for the shared Zig core.
  test:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          skipPush: true

      - name: Cache Zig
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .zig-cache
            .zig-global-cache
          key: depot-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            depot-zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Test
        run: nix develop -c zig build -Dapp-runtime=none test

  # Full GTK build on both CPU architectures, matching the "Test GTK
  # Build" step in test.yml.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - depot-ubuntu-24.04-8
          - depot-ubuntu-24.04-arm-8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          skipPush: true

      - name: Cache Zig
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .zig-cache
            .zig-global-cache
          key: depot-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            depot-zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Build GTK app
        run: |
          nix develop -c zig build \
            -Dapp-runtime=gtk \
            -Demit-docs -Demit-webdata

      - name: Verify binary
        run: nix develop -c ./zig-out/bin/ghostty +version

  # libghostty-vt is the embeddable library; build it and run its tests
  # without the GTK frontend.
  build-lib-vt:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ghostty
          skipPush: true

      - name: Cache Zig
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .zig-cache
            .zig-global-cache
          key: depot-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            depot-zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Build libghostty-vt
        run: nix develop -c zig build -Demit-lib-vt

      - name: Test libghostty-vt
        run: nix develop -c zig build test-lib-vt

      - name: Verify pkg-config file
        run: |
          export PKG_CONFIG_PATH="$PWD/zig-out/share/pkgconfig"
          nix develop -c pkg-config --validate libghostty-vt

  # Single aggregate check for branch protection, mirroring the
  # "required" job in test.yml.
  required:
    name: "Required Checks: Depot"
    if: always()
    runs-on: depot-ubuntu-24.04
    needs:
      - zig-fmt
      - test
      - build-linux
      - build-lib-vt
    steps:
      - name: Determine status
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if grep -q -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more Depot jobs failed: $results"
            exit 1
          fi
          echo "All Depot jobs passed: $results"
