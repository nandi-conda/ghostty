[workspace]
name = "ghostty"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tasks]
# Build the GTK app from source as a conda package (see dist/conda/README.md).
build-conda = "rattler-build build --recipe dist/conda/recipe.yaml -c conda-forge --output-dir dist-out/conda"
publish-conda-nandi-testing = "dist/conda/publish.sh"

[dependencies]
rattler-build = "*"
